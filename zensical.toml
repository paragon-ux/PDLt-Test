[project]
site_url = "https://paragon-ux.github.io/PDLt-Test/"
site_name = "PDLt & The System 2 Catalogue"
site_description = "A protocol harness for verified, auditable model execution: Python API, extensions SDK, REPL, headless CLI and MCP server"
site_author = "paragon-ux"
copyright = "Copyright &copy; 2026 PDL-Standard contributors. Released under the MIT License."

repo_url = "https://github.com/paragon-ux/PDLt-Test"
repo_name = "paragon-ux/PDLt-Test"

nav = [
  { "Overview" = "index.md" },
  { "Get started" = [
    { "Choose your host" = "getting-started.md" },
    { "Windows" = "hosts/windows.md" },
    { "Linux" = "hosts/linux.md" },
    { "macOS" = "hosts/macos.md" },
  ] },
  { "Use PDLt" = [
    { "Python API" = "api.md" },
    { "Extensions SDK" = "extensions.md" },
    { "REPL and headless runs" = "repl.md" },
    { "MCP server" = "mcp/EXTERNAL_TOOLS.md" },
  ] },
  { "Reference" = [
    { "Settings, files and failures" = "reference.md" },
    { "Providers and models" = "providers.md" },
    { "OS sandbox" = "SANDBOX.md" },
  ] },
  { "Design and evaluation" = [
    { "Architecture and routing" = "architecture.md" },
    { "Catalogue and evaluation" = "evaluation.md" },
    { "Benchmarks" = "benchmarks.md" },
  ] },
  { "Maintainers" = [
    { "Releasing" = "releasing.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/paragon-ux/PDLt-Test"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
