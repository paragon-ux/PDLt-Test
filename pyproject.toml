[build-system]
requires = ["hatchling<1.26.0"]
build-backend = "hatchling.build"

[project]
name = "pdl-taskmaster"
dynamic = ["version"]
description = "A protocol harness for verified, auditable model execution: Python API, extensions SDK, REPL, headless CLI and MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "PDL-Standard Contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5.0,<3.0.0",
    "markdown-it-py>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "anyio>=4.0.0",
    "jsonschema>=4.0.0",
    "mcp>=1.10",  # L123: the external MCP tests drive the server with the official client
    "pyyaml>=6.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "anyio>=4.0.0",
    "jsonschema>=4.0.0",
    "mcp>=1.10",  # L123: the external MCP tests drive the server with the official client
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/paragon-ux/PDLt-Test"
Documentation = "https://paragon-ux.github.io/PDLt-Test/"
Source = "https://github.com/paragon-ux/PDLt-Test"
Issues = "https://github.com/paragon-ux/PDLt-Test/issues"

[project.scripts]
pdlt = "pdl_taskmaster.host.cli:main"

[tool.hatch.version]
path = "src/pdl_taskmaster/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pdl_taskmaster"]
artifacts = [
    "src/pdl_taskmaster/contracts/**/*",
]
exclude = [
    "tests",
    "runs",
    "scratch",
    "*.log",
]

# Patterns are anchored with "/": an unanchored name such as "README.md" matches at any
# depth, which pulled stray files (other tools' worktrees) into the sdist. The
# evaluation plane (with experiments/, catalogue_runs.py and hidden_tests.py, which it
# and the tests import) is included because the shipped tests exercise it.
[tool.hatch.build.targets.sdist]
include = [
    "/src/pdl_taskmaster",
    "/contracts",
    "/tests",
    "/prompts",
    "/viewer",
    "/scripts",
    "/docs",
    "/graders.py",
    "/hidden_tests.py",
    "/run_catalogue.py",
    "/catalogue_runs.py",
    "/experiments",
    "/VERSION",
    "/NOTICE.md",
    "/LICENSE",
    "/README.md",
    "/ARCHITECTURE.md",
    "/TARGET_ARCHITECTURE.md",
    "/GOAL.md",
    "/REVIEWER.md",
    "/AGENTS.md",
    "/pyproject.toml",
]
exclude = [
    "runs",
    "scratch",
    "*.log",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
